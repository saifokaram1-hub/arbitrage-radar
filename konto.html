<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbitrage Radar — Mein Bereich</title>
<style>
  :root{--void:#060704;--void2:#0a0b07;--line:#211f12;--line2:#2f2b18;--line3:#41391f;--txt:#f2f1e7;--muted:#8b8c7c;--dim:#5c5d50;--faint:#3a3b31;--gold:#c7b24c;--gold-b:#e7d882;--gold-d:#7f7130;--pos:#9fbf3b;--neg:#b0402e;--mono:ui-monospace,"Cascadia Code",Consolas,monospace;--sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--void);color:var(--txt);font-family:var(--sans);font-size:14px;background-image:radial-gradient(120% 60% at 100% 0%,rgba(199,178,76,.05),transparent 55%)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .cmd{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:12px 20px;background:linear-gradient(180deg,#0b0c07,#080905);border-bottom:1px solid var(--line2)}
  .mark{width:32px;height:32px;position:relative;border:1px solid var(--gold-d);background:#0a0b06;flex:none}
  .mark::before,.mark::after{content:"";position:absolute;background:var(--gold)}
  .mark::before{left:9px;top:15px;width:14px;height:1px;box-shadow:0 -5px 0 var(--gold-d),0 5px 0 var(--gold-d)}
  .mark::after{left:15px;top:9px;width:1px;height:14px;box-shadow:-5px 0 0 var(--gold-d),5px 0 0 var(--gold-d)}
  h1{margin:0;font-size:13px;letter-spacing:.26em;text-transform:uppercase;font-weight:700}
  h1 span{color:var(--gold-b)}
  .cmd .sp{flex:1}.who{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .lnk{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line3);padding:8px 12px;text-decoration:none;background:#0a0b06}
  .lnk:hover{color:var(--gold-b);border-color:var(--gold-d)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line2);background:var(--void2)}
  .kpi{padding:16px 18px;border-right:1px solid var(--line)}.kpi:last-child{border-right:0}
  .kpi .l{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:6px;line-height:1}
  .kpi.g .v{color:var(--gold-b)}.kpi.p .v{color:var(--pos)}
  .wrap{padding:20px;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  .card{border:1px solid var(--line2);background:linear-gradient(180deg,#0b0c07,#080905)}
  .card h2{margin:0;padding:13px 16px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--line);font-weight:700}
  .card .b{padding:16px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .bkrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
  .bkrow:last-child{border-bottom:0}
  .bkrow .n{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
  .bktag{font-size:8.5px;letter-spacing:.08em;font-weight:700;padding:2px 6px;border:1px solid var(--line3)}
  .bktag.pm{color:var(--gold-b);border-color:var(--gold-d)}.bktag.ob{color:#c9c7bd}
  .bkrow .s{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .bkrow .s b{color:var(--pos)}
  table{width:100%;border-collapse:collapse}
  th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line2)}
  th.r,td.r{text-align:right}
  td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;font-family:var(--mono)}
  td.ev{font-family:var(--sans);color:var(--txt);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pos{color:var(--pos)}.tblwrap{overflow-x:auto}
  .empty{padding:34px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12px;line-height:1.7}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(3),.kpi:nth-child(4){border-top:1px solid var(--line)}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="cmd">
    <div class="mark"></div>
    <h1>Arbitrage Radar · <span>Mein Bereich</span></h1>
    <div class="sp"></div>
    <span class="who" id="who">…</span>
    <a class="lnk" href="index.html">Zur App</a>
    <a class="lnk" href="#" id="logout">Abmelden</a>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="l">Eingesetzt gesamt</div><div class="v num" id="kStake">–</div></div>
    <div class="kpi p"><div class="l">Gewinn gesamt</div><div class="v num" id="kProfit">–</div></div>
    <div class="kpi"><div class="l">Zurück gesamt</div><div class="v num" id="kReturn">–</div></div>
    <div class="kpi g"><div class="l">Ø Rendite</div><div class="v num" id="kRoi">–</div></div>
  </div>

  <div class="wrap">
    <div class="card">
      <h2>Gewinnentwicklung (kumuliert, netto)</h2>
      <div class="b" id="chart"><div class="empty">Lade …</div></div>
    </div>
    <div class="two">
      <div class="card">
        <h2>Wo du gesetzt hast (nach Buch)</h2>
        <div class="b" id="byBook"></div>
      </div>
      <div class="card">
        <h2>Analyse</h2>
        <div class="b" id="analysis"></div>
      </div>
    </div>
    <div class="card">
      <h2>Alle Einsätze &amp; Ergebnisse</h2>
      <div class="tblwrap">
        <table><thead><tr><th>Zeitpunkt</th><th>Markt</th><th>Buch</th><th class="r">Einsatz</th><th class="r">Gewinn</th><th class="r">Rendite</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6" class="empty">Lade …</td></tr></tbody></table>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(async function(){
  var auth = await window.arRequireAuth();
  if(!auth) return;
  var sb = auth.sb, prof = auth.profile;
  document.getElementById('who').textContent = prof.email;
  document.getElementById('logout').onclick = async function(e){ e.preventDefault(); await sb.auth.signOut(); location.replace('login.html'); };
  var eur=function(n){return (+n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';};
  var bookName=function(b){return b==='pm'?'Polymarket':b==='ob'?'Orbit-Broker':(b||'—');};

  var r = await sb.from('activity').select('*').order('created_at',{ascending:true});
  var acts = r.data || [];

  var totStake=0, totProfit=0; var rois=[];
  var byBook={};
  acts.forEach(function(a){
    var st=+a.stake||0, pr=+a.amount||0, bk=a.book||'—';
    totStake+=st; totProfit+=pr; if(a.roi)rois.push(+a.roi);
    if(!byBook[bk])byBook[bk]={stake:0,profit:0,n:0};
    byBook[bk].stake+=st; byBook[bk].profit+=pr; byBook[bk].n++;
  });
  var avgRoi = rois.length? rois.reduce(function(s,x){return s+x;},0)/rois.length : 0;
  document.getElementById('kStake').textContent=eur(totStake);
  document.getElementById('kProfit').textContent=(totProfit>=0?'+':'')+eur(totProfit);
  document.getElementById('kReturn').textContent=eur(totStake+totProfit);
  document.getElementById('kRoi').textContent=(avgRoi>=0?'+':'')+avgRoi.toFixed(2)+' %';

  // Chart
  (function(){
    var el=document.getElementById('chart');
    if(!acts.length){ el.innerHTML='<div class="empty">Noch keine Einsätze.<br>Sobald du im Ticket setzt (oder im Demo-Modus übst), erscheint hier dein Verlauf.</div>'; return; }
    var cum=0, pts=acts.map(function(a){ cum+=(+a.amount||0); return {t:new Date(a.created_at).getTime(), y:cum}; });
    var W=940,H=220,pad=30;
    var xs=pts.map(function(p){return p.t;}), ys=pts.map(function(p){return p.y;});
    var minX=Math.min.apply(null,xs),maxX=Math.max.apply(null,xs); if(maxX===minX)maxX=minX+1;
    var minY=Math.min.apply(null,ys.concat([0])),maxY=Math.max.apply(null,ys.concat([0])); if(maxY===minY)maxY=minY+1;
    function X(t){return pad+(t-minX)/(maxX-minX)*(W-2*pad);}
    function Y(v){return H-pad-(v-minY)/(maxY-minY)*(H-2*pad);}
    var d=pts.map(function(p,i){return (i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
    var base=Y(minY<0?0:minY);
    var area=d+' L'+X(pts[pts.length-1].t).toFixed(1)+' '+base.toFixed(1)+' L'+X(pts[0].t).toFixed(1)+' '+base.toFixed(1)+' Z';
    var zeroY=Y(0);
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
      '<line x1="'+pad+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+zeroY.toFixed(1)+'" stroke="#2f2b18" stroke-dasharray="3 3"/>'+
      '<path d="'+area+'" fill="rgba(199,178,76,.12)"/>'+
      '<path d="'+d+'" fill="none" stroke="#c7b24c" stroke-width="2"/>'+
      '<circle cx="'+X(pts[pts.length-1].t).toFixed(1)+'" cy="'+Y(pts[pts.length-1].y).toFixed(1)+'" r="3.5" fill="#e7d882"/></svg>';
  })();

  // By book
  (function(){
    var el=document.getElementById('byBook');
    var keys=Object.keys(byBook);
    if(!keys.length){ el.innerHTML='<div class="empty">Noch keine Daten.</div>'; return; }
    el.innerHTML=keys.map(function(b){var d=byBook[b];var tag=b==='pm'?'pm':b==='ob'?'ob':'';
      return '<div class="bkrow"><div class="n"><span class="bktag '+tag+'">'+(b==='pm'?'PM':b==='ob'?'OB':'?')+'</span>'+bookName(b)+'</div>'+
        '<div class="s">'+d.n+'× · Einsatz '+eur(d.stake)+' · <b>'+(d.profit>=0?'+':'')+eur(d.profit)+'</b></div></div>';
    }).join('');
  })();

  // Analysis
  (function(){
    var el=document.getElementById('analysis');
    if(!acts.length){ el.innerHTML='<div class="empty">Noch keine Aktivität.</div>'; return; }
    var best=Math.max.apply(null, acts.map(function(a){return +a.amount||0;}).concat([0]));
    var wins=acts.filter(function(a){return (+a.amount||0)>0;}).length;
    var days={}; acts.forEach(function(a){ days[new Date(a.created_at).toDateString()]=1; });
    var lines=[
      ['Aktionen gesamt', acts.length],
      ['Davon mit Gewinn', wins],
      ['Bester Einzeltreffer', eur(best)],
      ['Aktive Tage', Object.keys(days).length],
      ['Ø Einsatz', eur(acts.length? totStake/acts.length : 0)]
    ];
    el.innerHTML=lines.map(function(l){return '<div class="bkrow"><div class="n" style="font-weight:400;color:var(--muted);font-size:12.5px">'+l[0]+'</div><div class="s" style="color:var(--txt)">'+l[1]+'</div></div>';}).join('');
  })();

  // Table
  (function(){
    var tb=document.getElementById('tbody');
    if(!acts.length){ tb.innerHTML='<tr><td colspan="6" class="empty">Noch keine Einsätze.</td></tr>'; return; }
    tb.innerHTML=acts.slice().reverse().map(function(a){
      return '<tr><td>'+new Date(a.created_at).toLocaleString('de-DE')+'</td>'+
        '<td class="ev">'+(a.market||'—')+'</td>'+
        '<td>'+bookName(a.book)+'</td>'+
        '<td class="r">'+eur(a.stake)+'</td>'+
        '<td class="r pos">'+((+a.amount||0)>=0?'+':'')+eur(a.amount)+'</td>'+
        '<td class="r">'+((+a.roi||0)>=0?'+':'')+(+a.roi||0).toFixed(2)+' %</td></tr>';
    }).join('');
  })();
})();
</script>
</body>
</html>
